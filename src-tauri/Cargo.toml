[package]
name = "openvideoai"
version = "0.1.0"
description = "OpenVideoAI Desktop Studio"
authors = ["OpenVideoAI Team"]
edition = "2021"

[lib]
name = "openvideoai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
